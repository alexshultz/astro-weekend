<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movies at the Astro</title>
<meta name="robots" content="noindex">
<meta name="description" content="What's playing at the Astro, Friday Nov 27 and Saturday Nov 28.">
<meta property="og:title" content="Movies at the Astro this weekend">
<meta property="og:description" content="Hunger Games: Sunrise on the Reaping, Hexed, and Focker In-Law. Showtimes and trailers.">
<meta property="og:image" content="https://alexshultz.github.io/astro-weekend/posters/share.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://alexshultz.github.io/astro-weekend/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#4a0b17">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Oswald:wght@500;600&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, festive family invite — a night out at the small-town picture house.
   IDEA: the theatre's lit marquee and its changeable letterboard.
   PICTURE: a bulb-ringed marquee header; each film is a letterboard strip with showtimes beneath.
   COLOUR and TYPE: theatre-velvet crimson, letterboard white, warm bulb gold; Limelight + Oswald + Figtree.
   LAYOUT: one phone-width column: marquee, day switch, three films. */
:root{color-scheme:dark;--bg:#4a0b17;--bg2:#2a050c;--ink:#fbefe6;--soft:#e8c9c0;--board:#f7f3ea;--boardInk:#141010;--gold:#ffd27a;--goldDeep:#e9a93a;--line:rgba(255,220,200,.18)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#6a1222 0%,var(--bg) 45%,var(--bg2) 100%) fixed;color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}

/* Marquee */
.marquee{position:relative;margin:6px 0 22px;padding:22px 18px 20px;border-radius:18px;background:linear-gradient(180deg,#7d1527,#5a0d1b);box-shadow:0 0 0 3px #2a050c,0 0 0 6px var(--goldDeep),0 18px 40px rgba(0,0,0,.45);text-align:center;overflow:hidden}
.bulbs{position:absolute;inset:7px;border-radius:13px;pointer-events:none}
.bulbs::before,.bulbs::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:6px;
  background:radial-gradient(circle,var(--gold) 0 3.2px,transparent 4px) 0 0/16px 16px;
  -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  filter:drop-shadow(0 0 4px var(--gold))}
.bulbs::after{background-position:8px 8px;opacity:.25}
.bulbs::before{animation:chase 1.1s steps(1) infinite}
.bulbs::after{animation:chase 1.1s steps(1) infinite reverse}
@keyframes chase{0%{opacity:1}50%{opacity:.25}}
.marquee small{display:block;font-size:14px;color:var(--soft);margin-top:6px}
.marquee h1{font:400 clamp(34px,10vw,48px)/1.05 Limelight,serif;margin:10px 0 2px;color:var(--gold);text-shadow:0 0 18px rgba(255,200,110,.55);text-wrap:balance}
.marquee .when{font:600 20px/1.2 Oswald,sans-serif;letter-spacing:.02em;margin:8px 0 2px}

/* Day switch */
.days{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);margin-bottom:20px}
.days button{appearance:none;border:0;border-radius:10px;min-height:48px;background:transparent;color:var(--soft);font:600 16px/1.1 Figtree,sans-serif;cursor:pointer}
.days button span{display:block;font-weight:400;font-size:13px;opacity:.85}
.days button[aria-pressed=true]{background:var(--gold);color:#2a050c}
.days button:focus-visible,.trailer:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* Film cards */
.film{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;margin-bottom:18px;opacity:0;transform:translateY(14px);animation:rise .6s ease forwards}
.film:nth-child(2){animation-delay:.12s}.film:nth-child(3){animation-delay:.24s}
@keyframes rise{to{opacity:1;transform:none}}
.top{display:grid;grid-template-columns:clamp(104px,30vw,150px) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:12px}
.poster{display:block;width:100%;justify-self:stretch;padding:0;margin:0;border:0;background:none;cursor:zoom-in;border-radius:8px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.5),0 0 0 2px rgba(255,210,122,.35)}
.poster img{display:block;width:100%;height:auto}
.poster:focus-visible{outline:3px solid #fff;outline-offset:2px}
.top .meta{margin:10px 0 0}
.lightbox{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:20px;background:rgba(10,1,3,.92);cursor:zoom-out}
.lightbox.show{display:grid;animation:fade .25s ease}
.lightbox img{max-width:100%;max-height:calc(100vh - 40px);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
@keyframes fade{from{opacity:0}}
.board{background:var(--board) repeating-linear-gradient(180deg,transparent 0 21px,rgba(0,0,0,.08) 21px 23px);color:var(--boardInk);border-radius:8px;padding:12px 12px 10px;box-shadow:inset 0 0 0 2px #d8d1c2,0 6px 14px rgba(0,0,0,.35)}
.board h2{margin:0;font:600 clamp(19px,5.2vw,26px)/1.12 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.board .sub{font:500 14px/1.3 Oswald,sans-serif;letter-spacing:.04em;text-transform:uppercase;opacity:.7;margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:12px 2px 8px;font-size:15px;color:var(--soft)}
.rating{font:600 14px/1 Oswald,sans-serif;border:1.5px solid var(--ink);color:var(--ink);border-radius:5px;padding:4px 6px}
.film p{margin:0 2px 12px;font-size:16px}
.film .stars{font-size:14px;color:var(--soft);margin-top:-6px}
.times{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.times span{min-width:96px;border-radius:12px;border:1.5px solid var(--gold);padding:6px 12px}
.times b{display:block;font:600 19px/1.1 Oswald,sans-serif;white-space:nowrap;color:var(--gold)}
.times i{font-style:normal;font-size:13px;color:var(--soft);white-space:nowrap}
.trailer{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 16px 0 6px;border-radius:999px;background:#fff;color:#2a050c;text-decoration:none;font-weight:700;font-size:15px}
.trailer svg{width:34px;height:34px;flex:none}

.note{font-size:13px;color:var(--soft);text-align:center;margin:6px 8px 0}

@media (prefers-reduced-motion:reduce){
  .bulbs::before,.bulbs::after{animation:none}
  .film{animation:none;opacity:1;transform:none}
  .lightbox.show{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="marquee">
    <div class="bulbs" aria-hidden="true"></div>
    <small>Now showing</small>
    <h1>at the Astro</h1>
    <div class="when" id="when">Friday night · November 27</div>
    <small>Thanksgiving weekend · three new movies</small>
  </header>

  <div class="days" role="group" aria-label="Choose a day">
    <button type="button" data-day="fri" aria-pressed="true">Friday<span>Nov 27</span></button>
    <button type="button" data-day="sat" aria-pressed="false">Saturday<span>Nov 28 · matinee too</span></button>
  </div>

  <main id="films"></main>

  <p class="note">"Out around" times are the movie's length only; previews add a little.</p>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-label="Poster"><img id="lbImg" alt=""></div>

<script>
{
const films = [
  {id:'hg', title:'The Hunger Games', sub:'Sunrise on the Reaping', rating:'PG-13', mins:158, genre:'Action · Drama',
   blurb:'Forty years before Katniss, 16-year-old Haymitch Abernathy is reaped for the 50th Hunger Games, a Quarter Quell with twice the usual tributes. Intense, as you would expect.',
   stars:'Joseph Zada, Elle Fanning, Ralph Fiennes, Jesse Plemons',
   trailer:'https://youtu.be/fS35YSjopjE',
   fri:['19:00','21:00'], sat:['14:00','19:00','21:00']},
  {id:'hx', title:'Hexed', sub:'Walt Disney Animation', rating:'PG', mins:109, genre:'Animated · Family',
   blurb:'Teenage Billie finds out she is a witch and lands in the magical world of Hexe, with her overprotective mom right behind her. A mother-daughter adventure for all ages.',
   stars:'Voices of Hailee Steinfeld, Rashida Jones, Jodie Foster',
   trailer:'https://youtu.be/KXO21xZdUaM',
   fri:['19:00','22:00'], sat:['14:00','19:00','22:00']},
  {id:'fk', title:'Focker In-Law', sub:'Meet the Parents, part four', rating:'PG-13', mins:105, genre:'Comedy',
   blurb:"Greg and Pam's son Henry brings home his fiancée, and this time Greg is the one sizing up a future in-law while Jack keeps watch over the circle of trust.",
   stars:'Ben Stiller, Robert De Niro, Ariana Grande, Owen Wilson',
   trailer:'https://youtu.be/vyISuWUWcFs',
   fri:['19:00','21:15'], sat:['14:00','19:00','21:15']}
];
const dayLabel = {fri:'Friday night · November 27', sat:'Saturday · November 28'};
// Saturday's last show (Hexed, 10 PM) lets out ~11:49 PM Central; close the page after midnight.
const now = Date.now();
const ENDED = now >= Date.parse('2026-11-29T06:15:00Z');
let day = now >= Date.parse('2026-11-28T06:00:00Z') ? 'sat' : 'fri';

const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fmt = m => { m = ((m % 1440) + 1440) % 1440; let h = Math.floor(m/60), mm = m%60; const ap = h>=12?'PM':'AM'; h = h%12||12; return h + ':' + String(mm).padStart(2,'0') + ' ' + ap; };
const fmtShort = m => fmt(m).replace(':00 ',' ');
const runtime = m => Math.floor(m/60) + 'h ' + (m%60) + 'm';
const play = '<svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="#c4122f"/><path d="M13.5 10.5v13l10.5-6.5z" fill="#fff"/></svg>';

function render(){
  document.getElementById('when').textContent = dayLabel[day];
  document.querySelectorAll('.days button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.day === day)));
  document.getElementById('films').innerHTML = films.map(f => `
    <article class="film">
      <div class="top">
        <button type="button" class="poster" data-src="posters/${f.id}.jpg" aria-label="Show the ${f.title} poster larger"><img src="posters/${f.id}.jpg" alt="${f.title} poster" width="720" height="1066"></button>
        <div>
          <div class="board"><h2>${f.title}</h2><div class="sub">${f.sub}</div></div>
          <div class="meta"><span class="rating">${f.rating}</span><span>${runtime(f.mins)}</span><span>${f.genre}</span></div>
        </div>
      </div>
      <p>${f.blurb}</p>
      <p class="stars">${f.stars}</p>
      <div class="times">${f[day].map(t => {
        const s = toMin(t);
        return `<span><b>${fmtShort(s)}</b><i>out around ${fmt(s+f.mins)}</i></span>`;
      }).join('')}</div>
      <a class="trailer" href="${f.trailer}" target="_blank" rel="noopener">${play}Watch the trailer</a>
    </article>`).join('');
}

document.querySelector('.days').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  day = b.dataset.day; const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lbImg');
document.getElementById('films').addEventListener('click', e => {
  const b = e.target.closest('.poster'); if (!b) return;
  lbImg.src = b.dataset.src; lbImg.alt = b.querySelector('img').alt; lb.classList.add('show');
});
lb.addEventListener('click', () => lb.classList.remove('show'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('show'); });

if (ENDED) {
  document.querySelector('.days').remove();
  document.querySelector('.note').remove();
  document.getElementById('when').textContent = "That's a wrap";
  document.getElementById('films').innerHTML = '<p class="note" style="font-size:17px;margin:10px 8px 30px">These showings are over. Thanks for coming to the Astro this weekend!</p>';
} else {
  render();
}
});

const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lbImg');
document.getElementById('films').addEventListener('click', e => {
  const b = e.target.closest('.poster'); if (!b) return;
  lbImg.src = b.dataset.src; lbImg.alt = b.querySelector('img').alt; lb.classList.add('show');
});
lb.addEventListener('click', () => lb.classList.remove('show'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('show'); });

if (ENDED) {
  document.querySelector('.days').remove();
  document.querySelector('.note').remove();
  document.getElementById('when').textContent = "That's a wrap";
  document.getElementById('films').innerHTML = '<p class="note" style="font-size:17px;margin:10px 8px 30px">These showings are over. Thanks for coming to the Astro this weekend!</p>';
} else {
  render();
}
}
</script>
</body>
</html>
